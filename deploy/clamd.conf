Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogClean no
ConcurrentDatabaseReload no
MaxThreads 1
MaxQueue 4
StreamMaxLength 21M
MaxScanSize 200M
MaxFileSize 30M
MaxRecursion 20
MaxFiles 3000
AlertExceedsMax yes
ReadTimeout 120
SelfCheck 600
