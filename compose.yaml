name: cpv-library
services:
  web:
    build: .
    env_file: .env.local
    environment:
      APP_MODE: connected
      NODE_ENV: production
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
  worker:
    build: ./worker
    env_file: .env.local
    environment:
      CLAMAV_HOST: clamav
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    depends_on:
      clamav: {condition: service_healthy}
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: ["clamav-signatures:/var/lib/clamav"]
    mem_limit: 2g
    healthcheck:
      test: [CMD, clamdscan, --ping, "3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
volumes:
  clamav-signatures:
